{% extends 'base_auth.html' %}
{% block title %}Changer de mot de passe{% endblock %}

{% block content %}
<h2 class="text-xl mb-6">🔐 Changement de mot de passe</h2>

<form method="POST" class="space-y-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="arcade-button">Mettre à jour</button>
</form>

<p class="mt-6 text-sm text-center">
  Vous serez redirigé vers votre tableau de bord après validation.
</p>
{% endblock %}
